services:
  - type: web
    name: encogix-backend
    env: node
    plan: starter
    region: oregon
    
    # Build configuration
    buildCommand: "npm ci --include=optional && npm run build"
    startCommand: "npm start"
    
    # Auto-deploy on git push
    autoDeploy: true
    
    # Environment variables
    envVars:
      - key: NODE_ENV
        value: production

      - key: NEXT_PUBLIC_SITE_URL
        value: https://www.encogix.com

      - key: NEXT_PUBLIC_API_URL
        value: https://www.encogix.com

      - key: NEXT_PUBLIC_CASHFREE_ENV
        value: production
      
      - key: DATABASE_URL
        fromDatabase:
          name: encogix-db
          property: connectionString
      
      - key: ADMIN_USERNAME
        value: admin
      
      - key: ADMIN_PASSWORD
        sync: false  # Set in Render dashboard
      
      - key: JWT_SECRET
        sync: false  # Set in Render dashboard
      
      - key: CASHFREE_APP_ID
        sync: false  # Set in Render dashboard
      
      - key: CASHFREE_SECRET_KEY
        sync: false  # Set in Render dashboard

      - key: CASHFREE_ENV
        value: production

      - key: CASHFREE_RETURN_URL
        value: https://www.encogix.com/payment/success
      
      - key: BACKEND_PORT
        value: "5000"

databases:
  - name: encogix-db
    databaseName: encogix
    user: encogix_user
    plan: free

services:
  - type: web
    name: encogix-backend
    env: node
    plan: starter
    region: oregon
    
    # Build configuration
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    
    # Auto-deploy on git push
    autoDeploy: true
    
    # Environment variables
    envVars:
      - key: NODE_ENV
        value: production
      
      - key: DATABASE_URL
        fromDatabase:
          name: encogix-db
          property: connectionString
      
      - key: ADMIN_USERNAME
        value: admin
      
      - key: ADMIN_PASSWORD
        sync: false  # Set in Render dashboard
      
      - key: JWT_SECRET
        sync: false  # Set in Render dashboard
      
      - key: RAZORPAY_KEY_ID
        sync: false  # Set in Render dashboard
      
      - key: RAZORPAY_KEY_SECRET
        sync: false  # Set in Render dashboard
      
      - key: BACKEND_PORT
        value: "5000"

databases:
  - name: encogix-db
    databaseName: encogix
    user: encogix_user
    plan: free

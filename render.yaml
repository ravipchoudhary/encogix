services:
  - type: web
    name: encogix-app
    env: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SITE_URL
        value: https://encogix.com
      - key: NEXT_PUBLIC_WHATSAPP
        value: "919431607346"
      - key: NEXT_PUBLIC_CONTACT_EMAIL
        value: contact@encogix.com
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: encogix-db
          property: connectionString
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

databases:
  - name: encogix-db
    databaseName: encogix
    user: encogix_user
    plan: free

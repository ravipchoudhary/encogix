services:
  - type: web
    name: encogix-backend
    env: node
    plan: starter
    region: oregon
    
    # Don't use rootDir - we need to handle monorepo structure manually
    # rootDir: backend
    
    buildCommand: "npm ci && npm run build"
    
    # Start command  
    startCommand: "npm start"
    
    # Auto-deploy from git
    autoDeploy: true
    
    # Health check endpoint
    healthCheckPath: /api/health
    healthCheckInterval: 30
    
    # Environment variables
    envVars:
      - key: NODE_ENV
        value: production
      
      - key: MYSQL_URL
        sync: false
      
      - key: ADMIN_USERNAME
        value: admin
      
      - key: ADMIN_PASSWORD
        sync: false
      
      - key: JWT_SECRET
        sync: false
      
      - key: RAZORPAY_KEY_ID
        sync: false
      
      - key: RAZORPAY_KEY_SECRET
        sync: false
      
      - key: BACKEND_PORT
        value: "5000"


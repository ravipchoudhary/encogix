services:
  - type: web
    name: encogix-backend
    env: node
    plan: starter
    region: oregon
    
    # Don't use rootDir - we need to handle monorepo structure manually
    # rootDir: backend
    
    # Build using custom script to ensure Prisma generation happens
    buildCommand: "bash render-build.sh"
    
    # Start command  
    startCommand: "cd backend && npm start"
    
    # Auto-deploy from git
    autoDeploy: true
    
    # Health check endpoint
    healthCheckPath: /api/health
    healthCheckInterval: 30
    
    # Environment variables
    envVars:
      - key: NODE_ENV
        value: production
      
      - key: DATABASE_URL
        fromDatabase:
          name: encogix-db
          property: connectionString
      
      - key: ADMIN_USERNAME
        value: admin
      
      - key: ADMIN_PASSWORD
        sync: false
      
      - key: JWT_SECRET
        sync: false
      
      - key: RAZORPAY_KEY_ID
        sync: false
      
      - key: RAZORPAY_KEY_SECRET
        sync: false
      
      - key: BACKEND_PORT
        value: "5000"

databases:
  - name: encogix-db
    databaseName: encogix
    user: encogix_user
    plan: free
